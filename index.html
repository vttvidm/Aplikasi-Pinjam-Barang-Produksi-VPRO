<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Peminjaman & Pengembalian Alat</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- HTML5-QRCode Library CDN -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    #reader video {
      border-radius: 0.5rem;
    }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 480px;">
    
    <!-- Header Card -->
    <div class="card shadow-sm border-0 mb-3 text-center">
      <div class="card-body p-4">
        <h1 class="h5 fw-bold text-dark mb-1">Pencatatan Alat Kerja</h1>
        <p class="text-muted small mb-3">Peminjaman & Pengembalian Inventaris</p>
        
        <!-- Tab Switcher (Nav Pills) -->
        <div class="bg-light p-1 rounded-3 border">
          <div class="row g-1">
            <div class="col-6">
              <button id="tabPinjamBtn" onclick="switchTab('pinjam')" class="btn btn-primary w-100 btn-sm fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-up-right me-1"></i> Pinjam
              </button>
            </div>
            <div class="col-6">
              <button id="tabKembaliBtn" onclick="switchTab('kembali')" class="btn btn-light w-100 btn-sm fw-semibold text-secondary">
                <i class="bi bi-box-arrow-in-down-left me-1"></i> Kembalikan
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Card -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        
        <!-- Pemindai Barcode -->
        <div class="mb-4">
          <label class="form-label text-uppercase fw-bold text-secondary small tracking-wider mb-2">Pemindai Barcode</label>
          <div id="reader" class="rounded bg-light border border-dashed mb-3 d-none overflow-hidden"></div>
          <button id="scanBtn" type="button" onclick="toggleScanner()" class="btn btn-dark w-100 fw-medium d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-qr-code-scan"></i>
            <span id="scanBtnText">Buka Kamera Scan</span>
          </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert d-none mb-3 text-center small fw-medium" role="alert"></div>

        <!-- FORM PEMINJAMAN -->
        <form id="formPinjam" onsubmit="handlePinjamSubmit(event)">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">ID / Barcode Barang</label>
            <input type="text" id="pinjamIdBarang" required oninput="triggerCheckStok()" placeholder="Scan atau ketik kode barang..." class="form-control">
            <div id="stokStatusBox" class="mt-2 small fw-medium d-none"></div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Nama Peminjam</label>
            <input type="text" id="pinjamNama" required placeholder="Nama lengkap Anda" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Email Peminjam</label>
            <input type="email" id="pinjamEmail" required placeholder="contoh@email.com" class="form-control">
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-semibold">Tanggal Pengembalian</label>
            <input type="date" id="pinjamTglKembali" required class="form-control">
          </div>

          <button type="submit" id="submitPinjamBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
            Submit Peminjaman
          </button>
        </form>

        <!-- FORM PENGEMBALIAN -->
        <form id="formKembali" onsubmit="handleKembaliSubmit(event)" class="d-none">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">ID / Barcode Barang yang Dikembalikan</label>
            <input type="text" id="kembaliIdBarang" required placeholder="Scan atau ketik kode barang..." class="form-control">
          </div>

          <div class="alert alert-light border text-muted small mb-4">
            <i class="bi bi-info-circle-fill me-1 text-primary"></i> Pastikan alat dalam kondisi baik. Setelah dikonfirmasi, status transaksi akan diperbarui dan stok alat otomatis bertambah.
          </div>

          <button type="submit" id="submitKembaliBtn" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
            Konfirmasi Pengembalian
          </button>
        </form>

      </div>
    </div>
  </div>

  <script>
    let currentMode = 'pinjam';
    let html5QrcodeScanner = null;
    let isScannerActive = false;
    let checkStokTimeout = null;

    // Batas tanggal minimum pengembalian ke hari ini
    document.getElementById('pinjamTglKembali').min = new Date().toISOString().split('T')[0];

    function switchTab(mode) {
      currentMode = mode;
      const tabPinjamBtn = document.getElementById('tabPinjamBtn');
      const tabKembaliBtn = document.getElementById('tabKembaliBtn');
      const formPinjam = document.getElementById('formPinjam');
      const formKembali = document.getElementById('formKembali');

      hideAlert();

      if (mode === 'pinjam') {
        tabPinjamBtn.className = 'btn btn-primary w-100 btn-sm fw-semibold shadow-sm';
        tabKembaliBtn.className = 'btn btn-light w-100 btn-sm fw-semibold text-secondary';
        formPinjam.classList.remove('d-none');
        formKembali.classList.add('d-none');
      } else {
        tabKembaliBtn.className = 'btn btn-success w-100 btn-sm fw-semibold shadow-sm';
        tabPinjamBtn.className = 'btn btn-light w-100 btn-sm fw-semibold text-secondary';
        formKembali.classList.remove('d-none');
        formPinjam.classList.add('d-none');
      }
    }

    function toggleScanner() {
      const readerEl = document.getElementById('reader');
      const scanBtnText = document.getElementById('scanBtnText');

      if (isScannerActive) {
        stopScanner();
      } else {
        readerEl.classList.remove('d-none');
        scanBtnText.innerText = 'Tutup Kamera';
        isScannerActive = true;

        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
          fps: 10, 
          qrbox: { width: 220, height: 150 },
          aspectRatio: 1.0
        });

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().then(() => {
          document.getElementById('reader').classList.add('d-none');
          document.getElementById('scanBtnText').innerText = 'Buka Kamera Scan';
          isScannerActive = false;
        }).catch(err => console.error(err));
      }
    }

    function onScanSuccess(decodedText) {
      if (currentMode === 'pinjam') {
        document.getElementById('pinjamIdBarang').value = decodedText;
        triggerCheckStok();
      } else {
        document.getElementById('kembaliIdBarang').value = decodedText;
      }
      stopScanner();
    }

    function onScanFailure(error) {
      // Pembacaan per-frame (abaikan jika belum fokus)
    }

    // Pengecekan stok real-time (debounce 500ms)
    function triggerCheckStok() {
      clearTimeout(checkStokTimeout);
      const idBarang = document.getElementById('pinjamIdBarang').value.trim();
      const statusBox = document.getElementById('stokStatusBox');
      const submitBtn = document.getElementById('submitPinjamBtn');

      if (!idBarang) {
        statusBox.classList.add('d-none');
        submitBtn.disabled = false;
        return;
      }

      statusBox.classList.remove('d-none');
      statusBox.className = "mt-2 small fw-medium text-muted placeholder-glow";
      statusBox.innerText = "⏳ Memeriksa ketersediaan stok...";

      checkStokTimeout = setTimeout(() => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler((res) => {
            if (res.success) {
              if (res.stokTersedia > 0) {
                statusBox.className = "mt-2 p-2 rounded small fw-medium text-success bg-success-subtle border border-success-subtle";
                statusBox.innerText = `✓ ${res.namaBarang} (Stok Tersedia: ${res.stokTersedia})`;
                submitBtn.disabled = false;
              } else {
                statusBox.className = "mt-2 p-2 rounded small fw-medium text-danger bg-danger-subtle border border-danger-subtle";
                statusBox.innerText = `✕ ${res.namaBarang} - STOK HABIS!`;
                submitBtn.disabled = true;
              }
            } else {
              statusBox.className = "mt-2 p-2 rounded small fw-medium text-danger bg-danger-subtle border border-danger-subtle";
              statusBox.innerText = `✕ ${res.message}`;
              submitBtn.disabled = true;
            }
          }).cekStokBarang(idBarang);
        }
      }, 500);
    }

    function handlePinjamSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitPinjamBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Memproses...';

      const payload = {
        idBarang: document.getElementById('pinjamIdBarang').value,
        nama: document.getElementById('pinjamNama').value,
        email: document.getElementById('pinjamEmail').value,
        tglKembali: document.getElementById('pinjamTglKembali').value
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler((res) => {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Submit Peminjaman';

          if (res.success) {
            showAlert('success', res.message);
            document.getElementById('formPinjam').reset();
            document.getElementById('stokStatusBox').classList.add('d-none');
          } else {
            showAlert('danger', res.message);
          }
        }).prosesPeminjaman(payload);
      }
    }

    function handleKembaliSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitKembaliBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Memproses...';

      const idBarang = document.getElementById('kembaliIdBarang').value;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler((res) => {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Konfirmasi Pengembalian';

          if (res.success) {
            showAlert('success', res.message);
            document.getElementById('formKembali').reset();
          } else {
            showAlert('danger', res.message);
          }
        }).prosesPengembalian(idBarang);
      }
    }

    function showAlert(type, message) {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('d-none');
      alertBox.className = `alert alert-${type} mb-3 text-center small fw-medium`;
      alertBox.innerText = message;
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('d-none');
    }
  </script>
</body>
</html>
